site_name: statlite
site_description: A small, dependency-free statistics library.
site_url: https://quantumdot.github.io/advanced-github-demo-2/
repo_url: https://github.com/quantumdot/advanced-github-demo-2
repo_name: quantumdot/advanced-github-demo-2
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - API reference:
      - Descriptive: api/descriptive.md
      - Quantiles: api/quantiles.md
      - Correlation: api/correlation.md
  - Contributing: contributing.md
  - Maintainer setup: maintainers.md
