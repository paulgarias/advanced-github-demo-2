name: Bug report
description: Something returns the wrong result or raises unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include a minimal code example, the output you got, and what you expected.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: statlite version
      placeholder: "python -c 'import statlite; print(statlite.__version__)'"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
