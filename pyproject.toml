[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "statlite"
dynamic = ["version"]
description = "A small, dependency-free statistics library used for the Advanced GitHub workshop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Advanced GitHub Workshop" }]
keywords = ["statistics", "teaching", "workshop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100"]
lint = ["ruff>=0.17", "mypy>=1.11"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mike>=2.1",
]
dev = ["statlite[test,lint,docs]", "pre-commit>=3.8", "build", "twine"]

[project.urls]
Homepage = "https://github.com/quantumdot/advanced-github-demo-2"
Documentation = "https://quantumdot.github.io/advanced-github-demo-2/"
Issues = "https://github.com/quantumdot/advanced-github-demo-2/issues"
Changelog = "https://github.com/quantumdot/advanced-github-demo-2/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.hooks.vcs]
version-file = "src/statlite/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/statlite"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-exclude = ["src/statlite/_version.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.10"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src"]
addopts = "--doctest-modules --cov=statlite --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
branch = true
omit = ["src/statlite/_version.py"]
